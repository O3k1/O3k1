name: Generate Brick Breaker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG
        uses: cyprieng/github-breakout@v1.2.4
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paddle_color: "#7F00FF"
          ball_color: "#7F00FF"
          bricks_colors: "#2d0066,#4c0099,#6600cc,#7F00FF,#b366ff"

      - name: Move generated SVGs to temp
        run: |
          mkdir -p /tmp/breakout-images
          mv output/*.svg /tmp/breakout-images/

      - name: Push SVGs to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf .
          mv /tmp/breakout-images/*.svg .
          git add *.svg
          git commit -m "chore: update GitHub breakout SVGs"
          git push --force origin output

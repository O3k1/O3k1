
name: Generate Brick Breaker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Brick Breaker SVGs
        uses: cyprieng/github-breakout@v1
        with:
          github_username: O3k1
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paddle_color: "#7F00FF"
          ball_color: "#7F00FF"

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

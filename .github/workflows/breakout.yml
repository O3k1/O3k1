name: Generate Brick Breaker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Breakout SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx github-breakout ${{ github.repository_owner }} --token "$GITHUB_TOKEN" --paddle-color "#7F00FF" --ball-color "#7F00FF"

      - name: Deploy to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output-temp
          git rm -rf .
          mv output/*.svg .
          rm -rf output
          git add *.svg
          git commit -m "Update Brick Breaker SVGs"
          git branch -M output
          git push origin output --force
